        let presentationData = [];

        async function fetchData() {
            try {
                showStatus("데이터 로드 중...");
                const { data, error } = await supabaseClient
                    .from('presentations')
                    .select('*')
                    .order('date', { ascending: true })
                    .order('category', { ascending: false })
                    .order('slot_index', { ascending: true });
                
                if (error) {
                    showStatus("데이터 로드 실패: " + error.message, true);
                    return;
                }
                
                if (!data || data.length === 0) {
                    showStatus("데이터가 비어있습니다. DB 마이그레이션을 확인하세요.", true);
                    return;
                }
                
                // Custom sort for MM/DD strings
                const sortedData = data.sort((a, b) => {
                    const [am, ad] = a.date.split('/').map(Number);
                    const [bm, bd] = b.date.split('/').map(Number);
                    
                    if (am !== bm) return am - bm;
                    if (ad !== bd) return ad - bd;
                    
                    // Same date, sort by category (Public > Listed)
                    if (a.category !== b.category) {
                        return a.category === '공공' ? -1 : 1;
                    }
                    
                    return (a.slot_index || 0) - (b.slot_index || 0);
                });

                presentationData = sortedData;
                renderDashboard();
                showStatus("데이터 로드 완료");
                loadingEl.style.display = 'none';
            } catch (e) {
                showStatus("네트워크 또는 코드 에러: " + e.message, true);
            }
        }

        function renderDashboard() {
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';

            const groupedByDate = {};
            const uniqueDates = [];
            
            presentationData.forEach(p => {
                if (!groupedByDate[p.date]) {
                    groupedByDate[p.date] = { public: [], private: [] };
                    uniqueDates.push(p.date);
                }
                if (p.category === '공공') groupedByDate[p.date].public.push(p);
                else groupedByDate[p.date].private.push(p);
            });

            uniqueDates.forEach(date => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${date}</td>
                    <td>${createSlotsHtml(groupedByDate[date].public)}</td>
                    <td>${createSlotsHtml(groupedByDate[date].private)}</td>
                `;
                tbody.appendChild(tr);
            });
            refreshDropdowns();
        }

        function createSlotsHtml(slots) {
            return `
                <div class="slot-container">
                    ${slots.map(s => `
                        <div class="slot-wrapper">
                            <div class="slot">
                                <span class="slot-number">${s.slot_index}</span>
                                <div class="input-group">
                                    <select onchange="updatePresentation('${s.id}', this.value, null)">
                                        ${generateOptions(s.company, s.category)}
                                    </select>
                                    <input type="text" value="${s.name || ''}" 
                                           onblur="updatePresentation('${s.id}', null, this.value)"
                                           placeholder="이름 입력">
                                    <div class="time-tag">${s.comment_time || '&nbsp;'}</div>
                                </div>
                            </div>
                            ${s.error_msg ? `<span class="error-tag">${s.error_msg}</span>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function generateOptions(selected, category) {
            let opts = `<option value="" ${!selected ? 'selected' : ''}>선택 안함</option>`;
            if (selected === '변경 필요') {
                opts += `<option value="변경 필요" selected>변경 필요</option>`;
            }
            
            const targetList = category === '공공' ? publicCompanies : privateCompanies;

            // 데이터베이스의 값이 선택된 리스트에 없는 경우, 임시로 옵션에 추가 (데이터 소실 방지)
            if (selected && selected !== '변경 필요' && !targetList.includes(selected)) {
                opts += `<option value="${selected}" selected>${selected}</option>`;
            }

            targetList.forEach(c => {
                opts += `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`;
            });
            return opts;
        }

        async function updatePresentation(id, company, name) {
            const updates = {};
            if (company !== null) updates.company = company;
            if (name !== null) updates.name = name;

            const { error } = await supabaseClient
                .from('presentations')
                .update(updates)
                .eq('id', id);
            
            if (error) alert('업데이트 실패: ' + error.message);
        }

        function refreshDropdowns() {
            const selects = document.querySelectorAll('select');
            const selectedSet = new Set();
            
            // Collect all currently selected companies (excluding placeholder/error states)
            selects.forEach(s => {
                if (s.value && s.value !== '변경 필요' && s.value !== '선택 안함') {
                    selectedSet.add(s.value);
                }
            });

            selects.forEach(s => {
                const current = s.value;
                
                // Style the select element itself based on its value
                if (current === '변경 필요') {
                    s.style.color = '#ef4444'; // Red for error
                    s.style.fontWeight = '700';
                } else if (!current || current === '선택 안함') {
                    s.style.color = '#94a3b8'; // Muted for empty
                    s.style.fontWeight = '400';
                } else {
                    s.style.color = '#1e293b'; // Explicit dark for selected
                    s.style.fontWeight = '600';
                }

                Array.from(s.options).forEach(opt => {
                    // Don't gray out metadata options
                    if (!opt.value || opt.value === '변경 필요' || opt.value === '선택 안함') {
                        if (opt.value === '변경 필요') opt.style.color = '#ef4444';
                        return;
                    }

                    // Gray out and disable IF it's taken by SOMEONE ELSE
                    if (selectedSet.has(opt.value) && opt.value !== current) {
                        opt.style.textDecoration = 'line-through';
                        opt.style.color = '#cbd5e1';
                        opt.disabled = true;
                    } else {
                        opt.style.textDecoration = 'none';
                        opt.style.color = '#1e293b';
                        opt.disabled = false;
                    }
                });
            });
        }

        // Subscribe to real-time changes
        supabaseClient.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'presentations' }, (payload) => {
                fetchData(); // Simplest way to ensure consistency
            })
            .subscribe();

        fetchData();
    </script>
</body>
